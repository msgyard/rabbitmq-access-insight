name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # Run the test suite against the real rabbit_common of every supported
  # RabbitMQ line, at that line's latest patch release. Passing means the line
  # still exposes the API the plugin depends on and the plugin behaves
  # correctly against it. Supported lines: 3.12 to 4.3.
  #
  # Each line is built on an OTP it actually ships with. The last entry pins
  # 4.3 to OTP 28 as well, to catch a future runtime breaking the source before
  # an OTP 28 artifact is ever needed. OTP 25 is covered by test-otp25 below.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rmq: '3.12.14', otp: '26' }
          - { rmq: '3.13.7',  otp: '26' }
          - { rmq: '4.0.9',   otp: '26' }
          - { rmq: '4.1.8',   otp: '27' }
          - { rmq: '4.2.9',   otp: '27' }
          - { rmq: '4.3.6',   otp: '27' }
          - { rmq: '4.3.6',   otp: '28' }
    name: RabbitMQ ${{ matrix.rmq }} on OTP ${{ matrix.otp }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: '${{ matrix.otp }}', rebar3-version: '3' }
      - name: EUnit
        run: ./run-tests.sh --rmq-release ${{ matrix.rmq }}
      - name: Package .ez
        run: ./build-ez.sh --rmq-release ${{ matrix.rmq }}
      - run: ls -la _build/*.ez

  # OTP 25 -- the oldest runtime a release artifact targets -- runs in the
  # official Erlang image: setup-beam does not publish OTP 25 for current
  # runners. 3.12 is the newest RabbitMQ line that still supports OTP 25.
  test-otp25:
    runs-on: ubuntu-latest
    container: erlang:25
    name: RabbitMQ 3.12.14 on OTP 25
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl xz-utils zip
      - uses: actions/checkout@v4
      - name: EUnit
        run: ./run-tests.sh --rmq-release 3.12.14
      - name: Package .ez
        run: ./build-ez.sh --rmq-release 3.12.14
      - run: ls -la _build/*.ez

  # End to end on real brokers: a single node (all four protocols, enabling
  # on a running node, restart and kill -9) and a three-node cluster
  # (replication checks). Oldest and newest supported lines.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rmq: '3.12.14', otp: '26' }
          - { rmq: '4.3.6',   otp: '27' }
    name: e2e RabbitMQ ${{ matrix.rmq }} on OTP ${{ matrix.otp }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: '${{ matrix.otp }}', rebar3-version: '3' }
      - run: python3 -m pip install --quiet pika
      - name: Build
        run: ./build-ez.sh --rmq-release ${{ matrix.rmq }}
      - name: Single node
        run: test/e2e/node_e2e.sh "$RUNNER_TEMP/node" "$PWD"/_build/rmq-${{ matrix.rmq }}/rabbitmq_server-${{ matrix.rmq }} "$(ls _build/*.ez)" python3
      - name: Three-node cluster
        run: test/e2e/cluster_e2e.sh "$RUNNER_TEMP/cluster" "$PWD"/_build/rmq-${{ matrix.rmq }}/rabbitmq_server-${{ matrix.rmq }} "$(ls _build/*.ez)" python3
      - if: failure()
        run: tail -n 80 "$RUNNER_TEMP"/*/log/*.log "$RUNNER_TEMP"/*/*/log/*.log 2>/dev/null || true
